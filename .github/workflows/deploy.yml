name: Deploy site to Cloudflare Pages

# Runs when the page itself changes. The hourly story data (data/ and site/world.json)
# is read by the page straight from this repository, so it does not need a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/world.json'
      - 'functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 25045bce597c815225d60d2d51b0cf1d
          command: pages deploy site --project-name=tokensforest --branch=main --commit-dirty=true
